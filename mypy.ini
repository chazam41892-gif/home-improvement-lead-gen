[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
ignore_missing_imports = True
exclude = (?x)(^legacy/|^dist/|^build/|^\.venv/)

[mypy-engine.trades.platforms]
# ExaSearchProvider is a string forward reference resolved at runtime by
# typing.get_type_hints(); the provider is injected by the caller, not imported.
ignore_errors = True

[mypy-engine.persistence]
# LeadResult is a bare dataclass; newer columns are attached as dynamic
# attributes on load ("restore newer columns as attributes"), so mypy's
# strict attribute check produces false positives here.
disable_error_code = attr-defined

[mypy-engine.messaging.providers]
# `payload` is inferred as a heterogeneous dict; the `content` list append is
# valid at runtime (verified) but mypy widens the element type.
disable_error_code = attr-defined
