[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
norecursedirs = .git __pycache__ data static engine crm_plus
# --strict-markers: a typo'd @pytest.mark must fail loudly, not silently no-op.
addopts = --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
