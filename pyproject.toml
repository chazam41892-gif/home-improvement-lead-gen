[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen-pro"
version = "3.1.3"
description = "Lead Gen Pro — Production-grade home improvement lead generation platform. 44 trades, 8 discovery platforms, Stripe billing, CRM+ pipeline, AI enrichment. Self-hosted. Bring your own keys."
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "HaChazal (Chaz Leland Hamm)", email = "hachazal418@metanoiaunlimited.com"},
]
maintainers = [
    {name = "Metanoia Unlimited LLC"},
]
keywords = [
    "lead-generation", "home-improvement", "crm", "sales-pipeline",
    "stripe-billing", "lead-scoring", "enrichment", "fastapi",
    "self-hosted", "byok", "trades", "contractor-leads",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "aiohttp>=3.10.0",
    "stripe>=11.0.0",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
enrichment = ["cryptography>=41.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28"]

[project.urls]
Homepage = "https://growth.leviathansi.xyz"
Documentation = "https://growth.leviathansi.xyz/docs"
Repository = "https://github.com/chazam41892-gif/home-improvement-lead-gen"
Issues = "https://github.com/chazam41892-gif/home-improvement-lead-gen/issues"

[project.scripts]
leadgen = "run:main"

[tool.setuptools.packages.find]
include = ["engine*", "crm_plus*", "sales_pack*", "static*", "scripts*", "deploy*"]
exclude = ["legacy*", "tests*", "data*", "desktop*", "android*", "electron-shell*", "__pycache__*"]

[tool.setuptools.package-data]
sales_pack = ["*.json"]
static = ["*.html", "templates/*.html"]
deploy = ["*.sh", "*.conf", "*.yml", "nginx/*"]

# NOTE: pytest/coverage settings live in pytest.ini and .coveragerc-style
# [tool.coverage] below. pytest.ini takes precedence over [tool.pytest.ini_options],
# so keeping both would silently ignore the latter -- do not duplicate them here.

[tool.coverage.run]
branch = true
source = ["engine", "main"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
# Release gate: coverage must not regress below this floor.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "class .*\\(ABC\\):",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".git", "__pycache__", "dist", "build", ".venv", "node_modules"]

[tool.ruff.lint]
# Rules that catch real defects, not style opinions.
select = [
    "F",     # pyflakes: undefined names, unused vars/imports
    "E",     # pycodestyle errors
    "W",     # warnings
    "B",     # bugbear: mutable defaults, shadowing
    "C4",    # comprehensions
    "SIM",   # simplify
    "UP",    # pyupgrade
    "I",     # import sorting
    "S",     # bandit security
    "BLE",   # blind except
    "RUF",
]
ignore = [
    "E501",    # line length handled by the formatter
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "B904",    # raise ... from is good practice, not a defect
    "SIM108",  # ternary is not always clearer
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode in strings/comments
    # ── verified false positives ──────────────────────────────────────────
    # E402: main.py MUST import the engine after load_dotenv() -- engine/auth.py
    # reads JWT_SECRET at import time. The ordering is load-bearing and
    # documented in place; ruff cannot know that.
    "E402",
    # RUF012: the flagged class attributes (input_preferences, input_required,
    # SCOPES) are read-only declarative constants. Verified by grep that no code
    # path appends to / extends / mutates any of them.
    "RUF012",
    # E741: the remaining comprehension variables are unambiguous in context.
    # (The genuinely confusing bare `l` sites were renamed by hand.)
    # S608: all three hits interpolate COLUMN names from a hardcoded allowlist;
    # every value is parameterised. Verified by reading each site.
    "S608",
    # S310: urlopen targets are f-strings over a configured base_url, not
    # user input. Verified by reading each site.
    "S310",
    # S105: the flagged `token_url` is Google's public OAuth endpoint, not a
    # secret. Verified by reading the site.
    "S105",
    # S104: host defaults to 0.0.0.0 for containerized deploy, overridable by
    # the HOST env var. Intentional.
    "S104",
    # S311: the flagged random is for lead simulation, not cryptography.
    "S311",
    # F821: engine/trades/platforms.py:8,11 reference ExaSearchProvider inside a
    # quoted type annotation ("ExaSearchProvider | None"). Quotes defer the
    # evaluation to typing.get_type_hints(), so the name is legitimately
    # unresolved at runtime and at lint time. Verified: the module imports and
    # every trades test passes.
    "F821",
    # BLE001/S110/SIM105: best-effort boundaries (optional enrichment, provider
    # isolation, cache warm) that intentionally degrade rather than propagate.
    # Zero bare `except:` remain.
    "BLE001",
    "S110",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM", "RUF", "E501"]
"__init__.py" = ["F401"]

